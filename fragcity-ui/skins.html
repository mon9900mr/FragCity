<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101012">
<title>Skins Vault — FRAG CITY</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
.skin-vault{max-width:1200px;margin:auto;padding:42px 24px 70px}.vault-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.eyebrow{color:var(--red);font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.vault-head h1{font-size:clamp(32px,5vw,54px);line-height:1.05;margin:8px 0}.vault-head p{color:var(--muted);margin:0}.vault-count{color:var(--muted);white-space:nowrap}.vault-tools{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.vault-search{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:13px 15px;border-radius:6px}.vault-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.vault-tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:10px 15px;border-radius:5px;cursor:pointer}.vault-tab.active,.vault-tab:hover{border-color:var(--red);color:white;background:#f0444b18}.vault-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.vault-card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden;transition:transform .18s,border-color .18s}.vault-card:hover{transform:translateY(-3px);border-color:#f0444b88}.vault-card a{display:block}.vault-image{height:170px;background:linear-gradient(145deg,#202025,#141416);display:grid;place-items:center;padding:12px}.vault-image img{width:100%;height:100%;object-fit:contain}.vault-image .missing{color:var(--muted);font-size:12px;text-align:center}.vault-info{padding:13px}.vault-info small{color:var(--red);font-size:10px;text-transform:uppercase;letter-spacing:1px}.vault-info h3{font-size:14px;margin:5px 0 12px;min-height:42px}.vault-info .button{width:100%;text-align:center;display:block}.vault-status{color:var(--muted);padding:28px 0;text-align:center}.vault-pagination{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:24px;color:var(--muted)}@media(max-width:900px){.vault-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:620px){.vault-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.vault-image{height:125px}.skin-vault{padding:28px 14px}.vault-head{display:block}.vault-count{display:block;margin-top:10px}}
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">F</span><span>FRAG<span class="red">CITY</span><small>COUNTER-STRIKE HOSTING</small></span></a><button class="menu-toggle" aria-label="Toggle menu">☰</button><nav><a href="index.html">Home</a><a href="servers.html">Servers</a><a class="active" href="skins.html">Skins</a><a href="guides.html">Guides</a><a href="support.html">Support</a><a href="account.html">Account</a></nav><a class="button button-small" href="manage.html">Control panel <span>↗</span></a></header>
<main class="skin-vault">
<div class="vault-head"><div><div class="eyebrow">FRAG CITY ARMORY</div><h1>SKIN <span class="red">VAULT</span></h1><p>Choose a default item, open its page, then save and apply it to your server.</p></div><span class="vault-count" id="count">Loading catalog…</span></div>
<div class="vault-tools"><input class="vault-search" id="search" type="search" placeholder="Search weapons, knives, gloves…" aria-label="Search skins"></div>
<div class="vault-tabs" id="tabs"><button class="vault-tab active" data-cat="all">All defaults</button><button class="vault-tab" data-cat="rifles">Rifles</button><button class="vault-tab" data-cat="pistols">Pistols</button><button class="vault-tab" data-cat="snipers">Snipers</button><button class="vault-tab" data-cat="smgs">SMGs</button><button class="vault-tab" data-cat="shotguns">Shotguns</button><button class="vault-tab" data-cat="machineguns">Machine guns</button><button class="vault-tab" data-cat="knives">Knives</button><button class="vault-tab" data-cat="gloves">Gloves</button><button class="vault-tab" data-cat="zeus">Zeus</button></div>
<div class="vault-grid" id="grid"></div><div class="vault-status" id="status">Loading default items…</div><div class="vault-pagination"><button class="button button-ghost" id="prev" disabled>Previous</button><span id="page">Page 1</span><button class="button button-ghost" id="next" disabled>Next</button></div>
</main>
<script src="assets/js/app.js"></script>
<script>
(()=>{'use strict';
const grid=document.getElementById('grid'),status=document.getElementById('status'),search=document.getElementById('search'),count=document.getElementById('count'),pageLabel=document.getElementById('page'),prev=document.getElementById('prev'),next=document.getElementById('next');
const size=32;let all=[],shown=[],category='all',page=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const urlFor=item=>{const path=String(item.image||'');return path.startsWith('http')?path:new URL('../'+(path.startsWith('img/')?path:'img/weapon/'+path),document.baseURI).href};
function kind(item){const c=String(item.category||'').toLowerCase(),n=String(item.name||'').toLowerCase(),w=String(item.weapon||'').toLowerCase();if(c==='gloves'||n.includes('gloves')||w.includes('glove'))return 'gloves';if(c==='knives'||c==='utility'&&(/knife|bayonet|karambit|daggers|kukri|ursus|talon|falchion|bowie|stiletto|skeleton|paracord|survival|nomad|classic knife|flip knife|gut knife|huntsman|shadow daggers/.test(n+' '+w)))return 'knives';if(n.includes('zeus')||w.includes('taser')||w.includes('zeus'))return 'zeus';return c}
function isDefault(s){return /\|\s*default\s*$/i.test(s.name||'')||/\bdefault\b/i.test(s.name||'')}
function render(){const q=search.value.trim().toLowerCase();shown=all.filter(s=>(category==='all'||kind(s)===category)&&(!q||s.name.toLowerCase().includes(q)||String(s.weaponLabel||'').toLowerCase().includes(q)));const pages=Math.max(1,Math.ceil(shown.length/size));page=Math.min(page,pages-1);const items=shown.slice(page*size,(page+1)*size);grid.innerHTML=items.map(s=>{const p=new URLSearchParams({name:s.name,weapon:s.weapon||'',paint:s.paint||'0',image:s.image||'',category:kind(s)});return '<article class="vault-card"><a href="skin.html?'+p.toString()+'" aria-label="Open '+esc(s.name)+'"><div class="vault-image"><img loading="lazy" src="'+esc(urlFor(s))+'" alt="'+esc(s.name)+'" onerror="this.style.display=\'none\';this.nextElementSibling.hidden=false"><span class="missing" hidden>Image unavailable in repository</span></div><div class="vault-info"><small>'+esc(s.weaponLabel||kind(s)||'Default item')+'</small><h3>'+esc(s.name)+'</h3><span class="button button-ghost">View item ↗</span></div></a></article>'}).join('');status.textContent=shown.length?'':'No matching default items found.';count.textContent=all.length.toLocaleString()+' default items';pageLabel.textContent='Page '+(page+1)+' / '+pages;prev.disabled=page===0;next.disabled=page>=pages-1}
search.addEventListener('input',()=>{page=0;render()});document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;category=b.dataset.cat;page=0;document.querySelectorAll('.vault-tab').forEach(x=>x.classList.toggle('active',x===b));render()});prev.addEventListener('click',()=>{if(page>0){page--;render()}});next.addEventListener('click',()=>{if((page+1)*size<shown.length){page++;render()}});
fetch('assets/data/all-skins.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Catalog HTTP '+r.status);return r.json()}).then(data=>{if(!Array.isArray(data))throw Error('Invalid catalog');all=data.filter(s=>s&&s.name&&s.image&&isDefault(s));if(!all.length)throw Error('No default items found in catalog');all.sort((a,b)=>a.name.localeCompare(b.name));render()}).catch(err=>{status.textContent='Could not load the catalog: '+err.message;count.textContent='Catalog unavailable';console.error(err)});
})();
</script>
</body></html>
