<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101012"><title>Skins — FRAG CITY</title><link rel="stylesheet" href="assets/css/style.css">
<style>
.catalog{max-width:1200px;margin:auto;padding:36px 24px 70px}.catalog h1{font-size:42px;margin:0}.catalog p{color:var(--muted)}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.search{flex:1;min-width:220px;padding:13px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:5px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:9px 13px;border-radius:5px;cursor:pointer}.tab.active{border-color:var(--red);color:#fff}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden}.card:hover{border-color:var(--red)}.art{height:170px;background:linear-gradient(145deg,#202025,#121214);padding:12px;display:grid;place-items:center}.art img{width:100%;height:100%;object-fit:contain}.info{padding:12px}.info small{color:var(--red);text-transform:uppercase;font-size:10px}.info h3{font-size:14px;min-height:42px;margin:6px 0 12px}.info .button{display:block;text-align:center;width:100%}.status{text-align:center;color:var(--muted);padding:24px}.pages{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:20px;color:var(--muted)}@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:620px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.art{height:125px}.catalog{padding:26px 14px}}
</style></head><body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">F</span><span>FRAG<span class="red">CITY</span><small>COUNTER-STRIKE HOSTING</small></span></a><button class="menu-toggle" aria-label="Toggle menu">☰</button><nav><a href="index.html">Home</a><a href="servers.html">Servers</a><a class="active" href="skins.html">Skins</a><a href="guides.html">Guides</a><a href="support.html">Support</a><a href="account.html">Account</a></nav><a class="button button-small" href="manage.html">Control panel <span>↗</span></a></header>
<main class="catalog"><div class="eyebrow">FRAG CITY ARMORY</div><h1>SKIN <span class="red">CATALOG</span></h1><p id="summary">Discover individual skins and open a dedicated page for each item.</p><div class="tools"><input class="search" id="search" type="search" placeholder="Search any weapon or skin…"><select class="search" id="sort" style="flex:0 0 180px"><option value="name">Name A–Z</option><option value="weapon">Weapon</option></select></div>
<div class="tabs" id="tabs"><button class="tab active" data-cat="all">All items</button><button class="tab" data-cat="rifles">Rifles</button><button class="tab" data-cat="pistols">Pistols</button><button class="tab" data-cat="snipers">Snipers</button><button class="tab" data-cat="smgs">SMGs</button><button class="tab" data-cat="shotguns">Shotguns</button><button class="tab" data-cat="machineguns">Machine guns</button><button class="tab" data-cat="knives">Knives</button><button class="tab" data-cat="gloves">Gloves</button><button class="tab" data-cat="zeus">Zeus</button><button class="tab" data-cat="agents">Agents</button></div>
<div class="grid" id="grid"></div><div class="status" id="status">Reading skin catalog…</div><div class="pages"><button class="button button-ghost" id="prev" disabled>Previous</button><span id="page">Page 1</span><button class="button button-ghost" id="next" disabled>Next</button></div></main>
<script src="assets/js/app.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),grid=$('grid'),search=$('search'),sort=$('sort'),status=$('status');let all=[],shown=[],cat='all',page=0;const size=40;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const category=s=>{const c=String(s.category||'').toLowerCase(),n=String(s.name||'').toLowerCase(),w=String(s.weapon||'').toLowerCase();if(c==='gloves'||n.includes('gloves')||w.includes('glove'))return'gloves';if(c==='utility'&&/knife|bayonet|karambit|daggers|kukri|ursus|talon|falchion|bowie|stiletto|skeleton|paracord|survival|nomad|classic knife|flip knife|gut knife|huntsman/.test(n+' '+w))return'knives';if(n.includes('zeus')||w.includes('taser')||w.includes('zeus'))return'zeus';return c};
const imageUrl=s=>{const p=String(s.image||'');if(/^https?:/i.test(p))return p;const file=p.split('/').pop();const candidates=[new URL('../'+p,document.baseURI).href,'https://raw.githack.com/mon9900mr/FragCity/fragcity-skins-fix/fragcity-ui/'+p,'https://raw.githack.com/mon9900mr/FragCity/fragcity-redesign/fragcity-ui/'+p];return candidates[0]};
function render(){const q=search.value.trim().toLowerCase();const filtered=all.filter(s=>(cat==='all'||category(s)===cat)&&(!q||s.name.toLowerCase().includes(q)||String(s.weaponLabel||'').toLowerCase().includes(q)||String(s.weapon||'').toLowerCase().includes(q)));const groups=new Map();filtered.forEach(s=>{if(!groups.has(s.weapon))groups.set(s.weapon,{weapon:s.weapon,label:s.weaponLabel||s.name.split('|')[0].trim(),category:category(s),items:[]});groups.get(s.weapon).items.push(s)});shown=[...groups.values()].sort((a,b)=>sort.value==='weapon'?a.label.localeCompare(b.label):a.label.localeCompare(b.label));const pages=Math.max(1,Math.ceil(shown.length/size));page=Math.min(page,pages-1);grid.innerHTML=shown.slice(page*size,(page+1)*size).map(g=>{const representative=g.items.find(s=>/\\|\\s*default\\s*$/i.test(s.name))||g.items[0];const params=new URLSearchParams({view:'weapon',weapon:g.weapon,weaponLabel:g.label,category:g.category});return '<article class="card"><a href="skin.html?'+params.toString()+'"><div class="art"><img loading="lazy" src="'+esc(imageUrl(representative))+'" alt="'+esc(g.label)+'" onerror="this.onerror=null;this.src=\\'https://raw.githack.com/mon9900mr/FragCity/fragcity-skins-fix/fragcity-ui/'+esc(representative.image)+'\\';this.onerror=function(){this.style.display=\\'none\\';this.parentElement.textContent=\\'Image not found in repository\\'}"></div><div class="info"><small>'+esc(g.category)+' · '+g.items.length+' skins</small><h3>'+esc(g.label)+'</h3><span class="button button-ghost">View all '+esc(g.label)+' skins ↗</span></div></a></article>'}).join('');$('summary').textContent=shown.length.toLocaleString()+' weapons · '+all.length.toLocaleString()+' individual skin entries';status.textContent=shown.length?'':'No weapons match your search.';$('page').textContent='Page '+(page+1)+' / '+pages;$('prev').disabled=page===0;$('next').disabled=page>=pages-1}
search.addEventListener('input',()=>{page=0;render()});sort.addEventListener('change',render);$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;cat=b.dataset.cat;page=0;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});$('prev').addEventListener('click',()=>{page--;render()});$('next').addEventListener('click',()=>{page++;render()});
fetch('assets/data/all-skins.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Catalog HTTP '+r.status);return r.json()}).then(data=>{if(!Array.isArray(data))throw Error('Catalog format invalid');all=data.filter(s=>s&&s.name&&s.image&&s.category);if(!all.length)throw Error('Catalog contains no usable entries');render()}).catch(e=>{status.textContent='Catalog failed to load: '+e.message;console.error(e)});
})();
</script></body></html>
