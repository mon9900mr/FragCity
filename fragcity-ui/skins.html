<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101012"><title>Skin Vault — FRAG CITY</title><link rel="stylesheet" href="assets/css/style.css">
<style>
.skin-wrap{max-width:1240px;margin:auto;padding:44px 22px 80px}.skin-hero{padding:34px;background:linear-gradient(120deg,#1d1d22,#121214);border:1px solid var(--line);margin-bottom:26px}.skin-hero .eyebrow{color:var(--red);font-weight:800;letter-spacing:2px;font-size:11px}.skin-hero h1{font-size:clamp(34px,5vw,58px);margin:10px 0}.skin-hero p{color:var(--muted);max-width:700px}.skin-tools{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0 28px}.skin-tools input,.skin-tools select{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:12px 14px;border-radius:5px;min-width:200px}.skin-tools input{flex:1}.skin-section{margin:30px 0}.skin-section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}.skin-section h2{font-size:25px;margin:0}.skin-section-head p{color:var(--muted);margin:5px 0 0;font-size:13px}.weapon-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.weapon-card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden;transition:transform .18s,border-color .18s}.weapon-card:hover{transform:translateY(-3px);border-color:var(--red)}.weapon-art{height:165px;padding:14px;background:linear-gradient(145deg,#222228,#141417);display:grid;place-items:center}.weapon-art img{width:100%;height:100%;object-fit:contain}.weapon-copy{padding:13px 14px}.weapon-copy small{color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-size:10px}.weapon-copy h3{font-size:16px;margin:5px 0 7px}.weapon-copy p{color:var(--muted);font-size:12px;margin:0}.weapon-copy .button{display:block;text-align:center;margin-top:12px}.empty{padding:25px;color:var(--muted);border:1px dashed var(--line)}@media(max-width:900px){.weapon-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:620px){.skin-wrap{padding:24px 12px 50px}.skin-hero{padding:22px 18px}.weapon-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.weapon-art{height:120px}.weapon-copy{padding:10px}.weapon-copy h3{font-size:14px}}
</style></head><body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">F</span><span>FRAG<span class="red">CITY</span><small>COUNTER-STRIKE HOSTING</small></span></a><button class="menu-toggle" aria-label="Toggle menu">☰</button><nav><a href="index.html">Home</a><a href="servers.html">Servers</a><a class="active" href="skins.html">Skins</a><a href="guides.html">Guides</a><a href="support.html">Support</a><a href="account.html">Account</a></nav><a class="button button-small" href="manage.html">Control panel ↗</a></header>
<main class="skin-wrap"><section class="skin-hero"><div class="eyebrow">FRAG CITY / ARMORY</div><h1>SKIN <span class="red">VAULT.</span></h1><p>Choose a weapon to browse every skin available for it. Open any item to view its details and send a Use Skin request to your game server.</p><p id="catalog-summary">Loading default items…</p></section>
<div class="skin-tools"><input id="weapon-search" type="search" placeholder="Search weapons (AK-47, AWP, Zeus...)"><select id="category-filter"><option value="all">All categories</option><option value="rifles">Rifles</option><option value="pistols">Pistols</option><option value="snipers">Snipers</option><option value="smgs">SMGs</option><option value="shotguns">Shotguns</option><option value="machineguns">Machine guns</option><option value="knives">Knives & Zeus</option><option value="utility">Utility</option><option value="gloves">Gloves</option><option value="agents">Agents</option></select></div>
<div id="weapon-sections"><div class="empty">Loading catalog…</div></div></main>
<script src="assets/js/app.js"></script><script>
(()=>{const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let defaults=[];
const categoryNames={rifles:'Rifles',pistols:'Pistols',snipers:'Snipers',smgs:'SMGs',shotguns:'Shotguns',machineguns:'Machine guns',knives:'Knives & Zeus',utility:'Utility',gloves:'Gloves',agents:'Agents'};
const imageUrl=item=>{const raw=String(item.image||'');if(/^https?:\/\//i.test(raw))return raw;const paint=String(item.paint??'0');const weapon=String(item.weapon||'');const file=paint!=='0'&&weapon?'skins/'+weapon+'-'+paint+'.png':'weapon/'+weapon+'.png';return 'https://raw.githack.com/mon9900mr/FragCity/fragcity-redesign/img/'+file};
const label=item=>String(item.weaponLabel||item.name.split('|')[0]).trim();
function render(){const q=$('weapon-search').value.trim().toLowerCase(),cat=$('category-filter').value;const groups=new Map();for(const item of defaults){const key=item.weapon||item.weapon_defindex||item.name;if(!groups.has(key))groups.set(key,{key,label:label(item),category:item.category||'collectibles',item,count:0});groups.get(key).count++}
const list=[...groups.values()].filter(g=>(cat==='all'||g.category===cat)&&(!q||g.label.toLowerCase().includes(q)||g.item.name.toLowerCase().includes(q))).sort((a,b)=>a.label.localeCompare(b.label));
const byCat=new Map();for(const g of list){const c=categoryNames[g.category]?'': '';const section=categoryNames[g.category]||'Other items';if(!byCat.has(section))byCat.set(section,[]);byCat.get(section).push(g)}
$('weapon-sections').innerHTML=list.length?[...byCat].map(([title,items])=>'<section class="skin-section"><div class="skin-section-head"><div><h2>'+esc(title)+'</h2><p>'+items.length+' item types · choose one to see all finishes</p></div></div><div class="weapon-grid">'+items.map(g=>{const u=new URLSearchParams({view:'weapon',weapon:g.key,weaponLabel:g.label,category:g.category});return '<a class="weapon-card" href="skin.html?'+u.toString()+'"><div class="weapon-art"><img loading="lazy" src="'+esc(imageUrl(g.item))+'" alt="'+esc(g.label)+'" onerror="this.onerror=null;this.style.opacity=.25;this.alt=\'Image unavailable\'"></div><div class="weapon-copy"><small>'+esc(categoryNames[g.category]||'Item')+'</small><h3>'+esc(g.label)+'</h3><p>'+g.count+' catalog skins</p><span class="button button-ghost">Browse skins ↗</span></div></a>'}).join('')+'</div></section>').join(''):'<div class="empty">No matching items in the catalog.</div>'}
fetch('assets/data/all-skins.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Catalog HTTP '+r.status);return r.json()}).then(data=>{if(!Array.isArray(data))throw Error('Invalid catalog');const usable=data.filter(x=>x&&x.name&&x.image&&x.weapon);const byWeapon=new Map();for(const x of usable){const k=x.weapon;if(!byWeapon.has(k))byWeapon.set(k,[]);byWeapon.get(k).push(x)}defaults=[...byWeapon.values()].map(items=>items.find(x=>String(x.paint)==='0')||items[0]).filter(Boolean);$('catalog-summary').textContent=defaults.length+' weapon/item types · '+usable.length.toLocaleString()+' total skin entries';render()}).catch(e=>{$('catalog-summary').textContent='Catalog failed to load: '+e.message;$('weapon-sections').innerHTML='<div class="empty">Could not load the skin catalog. Check that assets/data/all-skins.json is available.</div>'});
$('weapon-search').addEventListener('input',render);$('category-filter').addEventListener('change',render);
})();
</script></body></html>
